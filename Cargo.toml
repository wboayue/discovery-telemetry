[package]
name = "discovery-telemetry"
version = "0.2.0"
edition = "2021"
description = "Shared wire-format types for discovery-* flight-controller telemetry (no_std, postcard + COBS)"
license = "MIT"
repository = "https://github.com/wboayue/discovery-telemetry"
readme = "README.md"
keywords = ["telemetry", "no-std", "postcard", "cobs", "embedded"]
categories = ["embedded", "no-std", "encoding", "aerospace"]

[features]
default = []
# Host conveniences: alloc-based decode helper, std error glue. Core stays no_std.
std = []

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
# serde's built-in array impls stop at length 32; Status::text is [u8; 48]. no_std, tiny.
serde-big-array = "0.5"
